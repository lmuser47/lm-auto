<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dealership · Inventory</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script><script src="app.js" defer></script>
</head>
<body>
  <aside><a class="logo" href="./">D<span>Dealership</span></a><p class="nav-label">WORKSPACE</p><a class="nav active" href="./">▦ &nbsp; Vehicle inventory</a><div class="aside-bottom">Your inventory, organized.<br><small>Dealer workspace</small></div></aside>
  <main>
    <header><span>Workspace / <strong>Inventory</strong></span><span class="avatar" aria-label="Dealer workspace">D</span></header>
    <section class="intro"><div><p class="eyebrow">YOUR DEALERSHIP</p><h1>Vehicle inventory</h1><p>Keep your lot moving. Manage every vehicle in one place.</p></div><button id="add" class="primary">＋ Add vehicle</button></section>
    <section class="toolbar" aria-label="Inventory controls"><div class="tabs"><button data-status="" aria-pressed="true" class="selected">All vehicles</button><button data-status="available" aria-pressed="false">Available</button><button data-status="pending" aria-pressed="false">Pending</button><button data-status="sold" aria-pressed="false">Sold</button></div><button id="refresh" class="secondary">↻ Refresh</button></section>
    <div id="notice" role="status" aria-live="polite"></div>
    <section id="inventory" class="grid" aria-label="Vehicles" aria-busy="true"></section>
    <footer><span id="page-label"></span><div><button id="previous" class="secondary">← Previous</button><button id="next" class="secondary">Next →</button></div></footer>
  </main>
  <dialog id="editor">
    <form id="vehicle-form"><div class="dialog-heading"><div><p class="eyebrow">INVENTORY</p><h2 id="form-title">Add vehicle</h2></div><button type="button" id="close" class="icon" aria-label="Close dialog">✕</button></div>
      <p class="form-note">Enter the vehicle details. Fields marked * are required.</p>
      <div class="fields">
        <label class="wide">VIN *<input name="vin" required maxlength="17" autocomplete="off"></label>
        <label>Make *<input name="make" required maxlength="50" placeholder="Honda"></label>
        <label>Model *<input name="model" required maxlength="50" placeholder="Accord"></label>
        <label>Year *<input name="year" type="number" required min="1" max="32767" step="1"></label>
        <label>Mileage *<input name="mileage" type="number" required min="0" step="1"></label>
        <label>Purchase price ($) *<input name="purchase_price" type="number" required min="0" max="9999999999.99" step="0.01"></label>
        <label>Asking price ($) *<input name="asking_price" type="number" required min="0" max="9999999999.99" step="0.01"></label>
        <label>Purchase date<input name="bought_date" type="date"></label>
        <label>Status<select name="status"><option value="available">Available</option><option value="pending">Pending</option><option value="sold">Sold</option></select></label>
        <label class="wide">Description<textarea name="description" rows="3" placeholder="Condition, features, and anything worth knowing…"></textarea></label>
      </div>
      <p id="form-error" role="alert"></p><div class="form-actions"><button type="button" id="cancel" class="secondary">Cancel</button><button id="save" class="primary" type="submit">Save vehicle</button></div>
    </form>
  </dialog>
</body>
</html>
